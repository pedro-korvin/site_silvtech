<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header Moderno - Silvtech</title>

    <!-- CSS do Header Moderno -->
    <link rel="stylesheet" href="./css/header.css" />
  </head>
  <body>
    <!-- Header Moderno -->
    <header id="header" class="header">
      <nav class="nav-container">
        <!-- Logo -->
        <div class="logo">
          <a href="/index.html">
            <img
              src="/assets/logo_silvtech.svg"
              alt="Silvtech - Marketing de Performance"
            />
          </a>
        </div>

        <!-- Desktop Navigation -->
        <ul class="nav-links">
          <li id="home"><a>Home</a></li>
          <li id="quemsomos"><a>Quem somos</a></li>
          <li id="servicos"><a>Serviços</a></li>
          <li id="blog"><a>Blog</a></li>
          <li id="fale-conosco"><a>Contato</a></li>
          <li id="metodologia"><a>Métodologia silvtech</a></li>
        </ul>

        <!-- Desktop CTA Button -->
        <div class="cta-button">
          <a href="/fale-conosco.html">Solicitar Diagnóstico</a>
        </div>

        <!-- Mobile Menu Button -->
        <div class="mobile-menu-btn">
          <div class="menu-icon">
            <div class="menu-line"></div>
            <div class="menu-line"></div>
            <div class="menu-line"></div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Mobile Menu Overlay será criado dinamicamente pelo JavaScript -->

    <!-- JavaScript do Header Moderno -->
    <script src="./js/header.js"></script>
  </body>
</html>
